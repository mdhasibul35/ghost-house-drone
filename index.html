// ================================================================ UTIL
const rand=(a=0,b=1)=>a+Math.random()*(b-a);
let _seed=7331; const srand=()=>{_seed=(_seed*16807)%2147483647;return (_seed-1)/2147483646;};
const sr=(a=0,b=1)=>a+srand()*(b-a);

// ================================================================ RENDERER
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);

const scene=new THREE.Scene();

scene.fog=new THREE.FogExp2(FOG_BASE.clone(),0.03);

const timeU={value:0};

// ================================================================ TEXTURES
function mkCanvas(w,h=w){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function toTex(c,{srgb=true,repeat=true}={}){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;if(repeat)t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}
function wrapCall(s,x,y,m,fn){for(const dx of [-s,0,s])for(const dy of [-s,0,s]){const X=x+dx,Y=y+dy;if(X<-m||X>s+m||Y<-m||Y>s+m)continue;fn(X,Y);}}
function speckle(g,s,n,col,size){g.fillStyle=col;for(let i=0;i<n;i++){const r=Math.random()*size+0.5;g.fillRect(Math.random()*s,Math.random()*s,r,r);}}
function blot(g,s,n,rgb,a0,a1,r0,r1){for(let i=0;i<n;i++){const x=Math.random()*s,y=Math.random()*s,r=rand(r0,r1),a=rand(a0,a1);wrapCall(s,x,y,r,(X,Y)=>{const gr=g.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(X-r,Y-r,2*r,2*r);});}}
function poly(g,pts,ox=0,oy=0){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0]+ox,p[1]+oy):g.moveTo(p[0]+ox,p[1]+oy));g.closePath();g.fill();}
function damask(g,x,y){g.save();g.translate(x,y);for(const m of [1,-1]){g.save();g.scale(m,1);g.beginPath();g.moveTo(0,-44);g.bezierCurveTo(18,-34,26,-10,8,0);g.bezierCurveTo(24,8,28,28,0,44);g.stroke();g.beginPath();g.arc(15,-16,5,0,7);g.stroke();g.beginPath();g.moveTo(8,0);g.quadraticCurveTo(34,-4,32,16);g.stroke();g.beginPath();g.arc(30,20,3,0,7);g.fill();g.restore();}g.beginPath();g.ellipse(0,0,4,11,0,0,7);g.fill();g.beginPath();g.moveTo(0,-54);g.lineTo(5,-46);g.lineTo(0,-40);g.lineTo(-5,-46);g.fill();g.restore();}

function texWallpaper(base,ink,peel){
  const s=512,c=mkCanvas(s),g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,s,s);
  for(let i=0;i<8;i++){g.fillStyle='rgba(255,255,255,0.03)';g.fillRect(i*64+2,0,3,s);g.fillStyle='rgba(0,0,0,0.14)';g.fillRect(i*64+30,0,1,s);}
  g.strokeStyle=ink;g.fillStyle=ink;g.lineWidth=2.2;
  for(let row=0;row<4;row++)for(let col=0;col<5;col++){const x=col*128+(row%2?64:0),y=row*128+64;damask(g,x,y);if(x>s-60)damask(g,x-s,y);}
  blot(g,s,20,'10,8,6',0.25,0.55,20,75);
  g.save();g.filter='blur(9px)';
  for(let i=0;i<3;i++){const x=rand(70,440),y=rand(60,280);g.fillStyle='rgba(3,3,4,0.5)';g.beginPath();g.ellipse(x,y,13,17,0,0,7);g.fill();g.beginPath();g.ellipse(x,y+72,24,58,rand(-.2,.2),0,7);g.fill();g.beginPath();g.moveTo(x-20,y+38);g.lineTo(x-52,y+rand(90,150));g.lineTo(x-38,y+40);g.fill();g.beginPath();g.moveTo(x+20,y+38);g.lineTo(x+46,y+rand(70,120));g.lineTo(x+34,y+42);g.fill();}
  g.restore();
  for(let i=0;i<16;i++){const x=rand(0,s),y=rand(0,s),l=rand(40,170);const gr=g.createLinearGradient(0,y,0,y+l);gr.addColorStop(0,'rgba(18,14,9,0.4)');gr.addColorStop(1,'rgba(18,14,9,0)');g.fillStyle=gr;g.fillRect(x,y,rand(2,5),l);}
  for(let i=0;i<8;i++){const x=rand(30,480),y=rand(30,480),r=rand(16,48);const pts=[];for(let k=0;k<10;k++){const a=k/10*PI*2,rr=r*rand(0.5,1.2);pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr*1.3]);}
    g.fillStyle='rgba(0,0,0,0.55)';poly(g,pts,3,3);g.fillStyle=peel;poly(g,pts);g.strokeStyle='rgba(210,200,180,0.25)';g.lineWidth=1;g.stroke();
    
    const p=pts[0];g.fillStyle='rgba(130,135,145,0.55)';g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(p[0]+rand(10,24),p[1]-rand(5,16));g.lineTo(pts[1][0],pts[1][1]);g.fill();}
  speckle(g,s,3500,'rgba(0,0,0,0.18)',2);speckle(g,s,1500,'rgba(255,255,255,0.035)',2);
  return toTex(c);
}
function texPlanks(dark=1){
  const s=512,c=mkCanvas(s),g=c.getContext('2d');const rows=8,h=s/rows;
  for(let r=0;r<rows;r++){let x=-rand(0,200);while(x<s){const L=rand(160,300),l=rand(8,16)*dark;g.fillStyle=`hsl(24,${rand(16,26)}%,${l}%)`;g.fillRect(x,r*h,L,h);
      for(let k=0;k<14;k++){g.strokeStyle=`rgba(0,0,0,${rand(.05,.22)})`;g.lineWidth=rand(.5,1.5);g.beginPath();const yy=r*h+rand(2,h-2);g.moveTo(x,yy);for(let xx=x;xx<x+L;xx+=16)g.lineTo(xx,yy+Math.sin(xx*0.05+k)*1.4);g.stroke();}
      if(Math.random()<.4){g.strokeStyle='rgba(0,0,0,0.35)';g.beginPath();g.ellipse(x+rand(20,L-20),r*h+h/2,rand(4,8),rand(2,4),0,0,7);g.stroke();}
      g.fillStyle='rgba(0,0,0,0.65)';g.fillRect(x,r*h,2,h);x+=L;}
    g.fillStyle='rgba(0,0,0,0.75)';g.fillRect(0,r*h,s,2);}
  blot(g,s,30,'150,150,145',0.04,0.12,30,90);speckle(g,s,4000,'rgba(190,190,180,0.06)',2);blot(g,s,10,'4,3,2',0.25,0.45,15,50);
  return toTex(c);
}
function texStone(){
  const s=512,c=mkCanvas(s),g=c.getContext('2d');g.fillStyle='#0b0d0f';g.fillRect(0,0,s,s);const rh=s/8;
  for(let r=0;r<8;r++){let x=(r%2)*-50;while(x<s){const w=rand(70,130),l=rand(14,23);g.fillStyle=`hsl(${rand(200,220)},${rand(4,9)}%,${l}%)`;g.fillRect(x+2,r*rh+2,w-4,rh-4);
    const gr=g.createLinearGradient(0,r*rh,0,r*rh+rh);gr.addColorStop(0,'rgba(255,255,255,0.06)');gr.addColorStop(1,'rgba(0,0,0,0.28)');g.fillStyle=gr;g.fillRect(x+2,r*rh+2,w-4,rh-4);x+=w;}}
  speckle(g,s,6000,'rgba(0,0,0,0.25)',2);speckle(g,s,3000,'rgba(255,255,255,0.04)',2);
  for(let i=0;i<16;i++){let x=rand(0,s),y=rand(0,s);g.strokeStyle='rgba(0,0,0,0.9)';g.lineWidth=rand(1,2.4);g.beginPath();g.moveTo(x,y);const n=rand(8,22);for(let k=0;k<n;k++){x+=rand(-14,14);y+=rand(4,16);g.lineTo(x,y);}g.stroke();}
  for(let i=0;i<45;i++){const x=rand(0,s),y=rand(0,s),r=rand(8,42);wrapCall(s,x,y,r,(X,Y)=>{const gr=g.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,'rgba(26,44,20,0.8)');gr.addColorStop(1,'rgba(20,35,18,0)');g.fillStyle=gr;g.fillRect(X-r,Y-r,2*r,2*r);});}
  speckle(g,s,1500,'rgba(40,62,30,0.5)',2);
  for(let i=0;i<25;i++){const x=rand(0,s);const gr=g.createLinearGradient(0,0,0,s);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(rand(.3,.7),'rgba(0,0,0,0.32)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x,0,rand(3,12),s);}
  return toTex(c);
}
function texRoof(){
  const s=512,c=mkCanvas(s),g=c.getContext('2d');g.fillStyle='#050607';g.fillRect(0,0,s,s);const h=32,w=32;
  for(let r=0;r<16;r++)for(let k=-1;k<17;k++){const x=k*w+(r%2?16:0),y=r*h;if(Math.random()<0.06)continue;g.fillStyle=`hsl(215,${rand(5,10)}%,${rand(9,17)}%)`;g.beginPath();g.moveTo(x+1,y);g.lineTo(x+w-1,y);g.lineTo(x+w-1,y+h*0.9);g.quadraticCurveTo(x+w/2,y+h*1.25,x+1,y+h*0.9);g.closePath();g.fill();g.strokeStyle='rgba(0,0,0,0.6)';g.stroke();}
  blot(g,s,25,'24,38,20',0.3,0.7,10,40);speckle(g,s,3000,'rgba(0,0,0,0.3)',2);return toTex(c);
}
function texGround(){
  const s=512,c=mkCanvas(s),g=c.getContext('2d');g.fillStyle='#16150f';g.fillRect(0,0,s,s);
  blot(g,s,40,'5,5,3',0.3,0.6,20,70);blot(g,s,30,'40,38,28',0.15,0.35,15,60);
  for(let i=0;i<1100;i++){const x=rand(0,s),y=rand(0,s);g.save();g.translate(x,y);g.rotate(rand(0,7));g.fillStyle=`hsl(${rand(25,70)},${rand(15,35)}%,${rand(6,17)}%)`;g.beginPath();g.ellipse(0,0,rand(3,8),rand(1.5,3.5),0,0,7);g.fill();g.restore();}
  g.strokeStyle='rgba(30,22,14,0.8)';for(let i=0;i<90;i++){const x=rand(0,s),y=rand(0,s),a=rand(0,7),l=rand(6,30);g.lineWidth=rand(.6,2);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  speckle(g,s,5000,'rgba(0,0,0,0.3)',2);return toTex(c);
}
function texPlaster(){
  const s=512,c=mkCanvas(s),g=c.getContext('2d');g.fillStyle='#2c3035';g.fillRect(0,0,s,s);blot(g,s,30,'15,14,12',0.15,0.4,20,90);
  for(let i=0;i<6;i++){const x=rand(0,s),y=rand(0,s);for(let k=0;k<4;k++){g.strokeStyle=`rgba(40,30,15,${0.25-k*0.05})`;g.lineWidth=2;g.beginPath();g.ellipse(x,y,20+k*14,16+k*11,0,0,7);g.stroke();}}
  for(let i=0;i<10;i++){let x=rand(0,s),y=rand(0,s);g.strokeStyle='rgba(0,0,0,0.6)';g.lineWidth=1;g.beginPath();g.moveTo(x,y);for(let k=0;k<15;k++){x+=rand(-12,12);y+=rand(-12,12);g.lineTo(x,y);}g.stroke();}
  speckle(g,s,4000,'rgba(0,0,0,0.2)',2);return toTex(c);
}
function texBark(){
  const s=256,c=mkCanvas(s),g=c.getContext('2d');g.fillStyle='#16130f';g.fillRect(0,0,s,s);
  for(let i=0;i<220;i++){const x=rand(0,s);g.strokeStyle=`rgba(${rand(0,50)},${rand(0,45)},${rand(0,35)},${rand(.3,.8)})`;g.lineWidth=rand(1,4);g.beginPath();g.moveTo(x,0);let xx=x;for(let y=0;y<=s;y+=16){xx+=rand(-3,3);g.lineTo(xx,y);}g.stroke();}
  blot(g,s,12,'28,40,22',0.3,0.6,10,40);return toTex(c);
}
function texDoor(scratched){
  const W=256,H=512,c=mkCanvas(W,H),g=c.getContext('2d');

function treeGeo(height,dead){

  }

}

  bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.75,0.55,0.82);composer.addPass(bloom);
  gradePass=new ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0},uRed:{value:0},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime;uniform float uRed;uniform vec2 uRes;varying vec2 vUv;
    float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    void main(){vec2 c=vUv-.5;float r2=dot(c,c);float ca=.0012+r2*.004;vec3 col;col.r=texture2D(tDiffuse,vUv+c*ca).r;col.g=texture2D(tDiffuse,vUv).g;col.b=texture2D(tDiffuse,vUv-c*ca).b;

  if(inBox(P,-12,-4,4.1,8.3,-5.5,8)){const to=V3(P.x-teddy.position.x,0,P.z-teddy.position.z);const d=to.length();if(d>1.3){to.normalize();const seen=looking(teddy.position,0.75);const sp=seen?0.11:0.45;teddy.position.addScaledVector(to,sp*dt);teddy.position.x=clamp(teddy.position.x,-11.5,-4.5);teddy.position.z=clamp(teddy.position.z,-5,7.5);teddy.rotation.y=Math.atan2(to.x,to.z);teddy.rotation.z=Math.sin(gtime*9)*0.06;teddyMoved+=sp*dt;if(Math.random()<dt*0.7)sNoise(teddy.position,{dur:0.3,type:'bandpass',f:900,q:4,gain:0.2});if(teddyMoved>0.5&&seen)discover('toy');}}
  // dust forming figure
  const db=dust.userData;if(gtime>dustNext&&!db.forming){db.forming=gtime;dustNext=gtime+rand(18,28);}
  let form=0;if(db.forming){const k=(gtime-db.forming);form=k<2.5?k/2.5:k<5.5?1:k<8?1-(k-5.5)/2.5:0;if(k>8)db.forming=0;if(form>0.8&&P.distanceTo(V3(0,1,6.2))<11&&looking(V3(0,1,6.2),0.7))discover('dust');}
  const pos=dust.geometry.attributes.position.array;for(let i=0;i<pos.length/3;i++){const b=i*4,ph=db.base[b+3];const t=gtime*0.15+ph;const r=0.4+0.3*Math.sin(ph);
    let x=db.base[b]+Math.sin(t*1.3+ph)*r+Math.sin(gtime*0.4+db.base[b+1])*0.4,y=db.base[b+1]+Math.sin(t*0.9+ph*2)*0.25,z=db.base[b+2]+Math.cos(t*1.1+ph)*r;
    const s=smooth(form);x=lerp(x,db.tgt[i*3],s);y=lerp(y,db.tgt[i*3+1],s);z=lerp(z,db.tgt[i*3+2],s);pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;}
  dust.geometry.attributes.position.needsUpdate=true;dust.material.opacity=0.3+form*0.45;
  // hidden red room â€” silence, then reveal
  if(redCooldown<=0&&inBox(P,8,12,4.1,8.3,-5.5,8)){redCooldown=100;discover('hidden');silenced=true;if(A.ctx)A.amb.gain.setTargetAtTime(0,A.ctx.currentTime,0.15);redLamp.mul=0.15;
    after(2.6,()=>{lightning(1);sSting();redLamp.mul=2.2;const cam=camera.position.clone();const start=V3(10,F1,7.2);const end=cam.clone().add(camFwd().multiplyScalar(-0.2));end.y=F1;playGhost([start,start.clone().lerp(end,0.5),end],1.1,{face:cam,op:1.6,eyes:true});document.getElementById('redflash').style.opacity=1;gradePass.uniforms.uRed.value=0.8;shake=0.35;
      after(1.2,()=>{redLamp.mul=1;document.getElementById('redflash').style.opacity=0;gradePass.uniforms.uRed.value=0;});after(3,()=>{silenced=false;if(A.ctx)A.amb.gain.setTargetAtTime(1,A.ctx.currentTime,1.5);});});}
  // ambient random sounds
  if(!silenced&&gtime>nextAmbient&&A.ctx){nextAmbient=gtime+rand(5,12);const r=Math.random();const off=V3(rand(-4,4),rand(0,2),rand(-4,4));const cp=camera.position.clone().add(off);
    if(inside){if(r<0.35)sWhisper(cp);else if(r<0.55)sScratch(cp.clone().add(V3(0,1.5,0)),5);else if(r<0.75)sCreak(cp,rand(0.6,1.2),rand(60,120));else sThud(cp.clone().add(V3(0,3,0)));}
    else{if(r<0.4)sCaw(V3(rand(-30,30),30,rand(-30,10)));else if(r<0.6)sWhisper(cp);else sCreak(V3(rand(-10,10),5,rand(-6,6)),rand(1,1.6),rand(50,80));}}
  if(A.ctx){const t=A.ctx.currentTime;A.insectG.gain.setTargetAtTime(inside?0.002:0.012,t,0.5);A.windG.gain.setTargetAtTime(inside?0.18:0.45,t,0.5);A.rumbleG.gain.setTargetAtTime(inside?0.4:0.22,t,0.5);}
}
const smooth=t=>t*t*(3-2*t);

// ================================================================ WORLD UPDATE
function updateWorld(dt){
  timeU.value=gtime;
  for(const L of lamps){let f=0.82+0.1*Math.sin(gtime*L.speed+L.phase)+0.08*Math.sin(gtime*L.speed*2.7+L.phase*3)+(Math.random()-0.5)*0.06;if(L.dying){const c=Math.sin(gtime*0.7+L.phase);if(c>0.6&&Math.random()<0.25)f*=rand(0,0.3);}L.light.intensity=L.base*f*L.mul;for(const gl of L.glows)if(gl.material.opacity!==undefined&&gl.material.map===T.glow)gl.material.opacity=0.22*f;}
  for(const f of flames){const b=f.userData.base;const k=0.85+Math.random()*0.25;f.scale.set(b*0.55*(0.9+Math.random()*0.2),b*k,1);}
  for(const s of fogSprites){s.position.addScaledVector(s.userData.v,dt);s.material.rotation+=dt*0.02;if(!s.userData.inside){if(s.position.x>60)s.position.x=-60;if(s.position.x<-60)s.position.x=60;if(s.position.z>60)s.position.z=-50;if(s.position.z<-50)s.position.z=60;}else{if(s.position.x>11||s.position.x<-11)s.userData.v.x*=-1;if(s.position.z>7||s.position.z<-7)s.userData.v.z*=-1;}}
  for(const r of ravens){const u=r.userData;const a=gtime*u.sp+u.ph;r.position.set(u.cx+Math.cos(a)*u.r,u.h+Math.sin(a*2.3)*2,u.cz+Math.sin(a)*u.r);r.rotation.y=-a+(u.sp>0?0:PI);const fl=Math.sin(gtime*9+u.ph)*0.6;u.wl.rotation.z=fl;u.wr.rotation.z=-fl;}
}

// ================================================================ MAP
function drawMap(){
  const cv=document.getElementById('mapc'),g=cv.getContext('2d'),W=cv.width,H=cv.height;
  g.fillStyle='#c4b796';g.fillRect(0,0,W,H);for(let i=0;i<40;i++){const x=rand(0,W),y=rand(0,H),r=rand(20,120);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(90,70,40,${rand(0.05,0.15)})`);gr.addColorStop(1,'rgba(90,70,40,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);}
  g.fillStyle='#2a2016';g.font='26px "IM Fell English", serif';g.textAlign='center';g.fillText('RAVENMOOR HOUSE',W/2,44);g.font='italic 15px "IM Fell English", serif';g.fillText("Surveyor's plan of the two principal floors â€” 1887",W/2,66);
  const s=13,oy=120;const plans=[{ox:28,label:'GROUND FLOOR',rooms:[[-12,0,-4,8,'Parlour'],[-12,-8,-4,0,'Dining Room'],[-4,-8,4,8,'Great Hall'],[4,-8,6,8,'Passage'],[6,0,12,8,'Library'],[6,-8,12,0,'Kitchen']]},
    {ox:W-28-24*s,label:'FIRST FLOOR',rooms:[[-12,-5.5,-4,8,'Nursery'],[-4,-5.5,4,8,'Gallery'],[4,-5.5,12,8,'Master Bedchamber'],[-12,-8,12,-5.5,'Corridor']]}];
  const P=actor();
  plans.forEach((pl,pi)=>{const X=x=>pl.ox+(x+12)*s,Y=z=>oy+(z+8)*s;g.strokeStyle='#2a2016';g.lineWidth=4;g.strokeRect(X(-12),Y(-8),24*s,16*s);g.lineWidth=1.5;
    for(const [x0,z0,x1,z1,n] of pl.rooms){g.strokeRect(X(x0),Y(z0),(x1-x0)*s,(z1-z0)*s);g.font='italic 13px "IM Fell English", serif';g.fillText(n,X((x0+x1)/2),Y((z0+z1)/2)+4);}
    if(pi===0){g.beginPath();for(let i=0;i<=10;i++){const z=1-i*0.6;g.moveTo(X(-1.5),Y(z));g.lineTo(X(1.5),Y(z));}g.stroke();g.fillText('front door',X(0),Y(8)+20);}else{g.setLineDash([4,4]);g.strokeRect(X(-1.5),Y(-5),3*s,6*s);g.setLineDash([]);}
    g.font='14px Cinzel, serif';g.fillText(pl.label,X(0),oy-14);
    const onThis=(P.y<4.1)===(pi===0);if(onThis&&insideHouse(P)){g.fillStyle='#8a0e16';g.beginPath();g.arc(X(P.x),Y(P.z),6,0,7);g.fill();g.fillStyle='#2a2016';}});
  g.font='italic 16px "IM Fell English", serif';g.fillStyle='#3a2a1c';g.textAlign='left';
  const notes=found.hidden?['The first floor has four rooms on this plan.','I have counted five.']:['"Do not open the cellar. Do not count the rooms."','â€” written in the margin, hand unknown'];
  notes.forEach((n,i)=>g.fillText(n,40,H-56+i*22));
  if(inBox(P,8,12,4.1,8.3,-5.5,8)){g.fillStyle='#8a0e16';g.font='italic 22px "IM Fell English", serif';g.textAlign='center';g.fillText('You are standing in a room that is not on the plan.',W/2,H-90);}
  g.textAlign='right';g.fillStyle='#3a2a1c';g.font='12px system-ui';g.fillText('click or press M to close',W-30,H-20);
}

// ================================================================ BUILD
function build(){
  buildTextures();buildMaterials();buildSky();buildGround();buildMansion();buildFence();buildJungle();buildAtmosphere();buildGhosts();buildDrone();buildSparks();buildPost();
  spot=new THREE.SpotLight(0xdfe8ff,0,28,0.48,0.55,2);spot.castShadow=true;spot.shadow.mapSize.set(1024,1024);spot.shadow.bias=-0.0008;spot.shadow.camera.near=0.1;scene.add(spot);scene.add(spot.target);
  const origOBR=mirror.onBeforeRender;mirror.onBeforeRender=function(r,s,c,...rest){mirrorGhost.visible=mirrorOn>0;origOBR.call(this,r,s,c,...rest);mirrorGhost.visible=false;};
  refreshJournal();setupTouch();
}
build();
document.getElementById('loading').style.display='none';document.getElementById('startRow').style.display='flex';
document.querySelectorAll('#start .startbtn').forEach(b=>b.addEventListener('click',()=>{audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();document.getElementById('start').style.display='none';document.getElementById('hud').classList.remove('hidden');started=true;
  player.pos.set(0,0,46);player.yaw=0;player.pitch=0.03;setMode(b.dataset.mode);if(b.dataset.mode==='drone'){drone.pos.set(0,2.2,42);drone.yaw=0;drone.visYaw=0;}document.getElementById('bLight').classList.add('on');document.getElementById('bSound').classList.add('on');
  if(!isTouch)canvas.requestPointerLock?.();toast(b.dataset.mode==='walk'?'Find what haunts Ravenmoor House':'The drone is airborne',3);}));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);gradePass.uniforms.uRes.value.set(innerWidth,innerHeight);});

// ================================================================ LOOP
let last=performance.now()/1000,frameN=0;
function frame(){
  requestAnimationFrame(frame);const now=performance.now()/1000;const dt=Math.min(0.05,now-last);last=now;gtime+=dt;
  if(!started){const t=gtime*0.02;const k=Math.min(1,gtime/40);camera.position.set(Math.sin(gtime*0.05)*4,3+Math.sin(gtime*0.1)*0.5,lerp(58,34,smooth(k)));camera.lookAt(2,6.5,0);updateWorld(dt);
    let fl=0;if(gtime>nextLightning){lightning(0.8);nextLightning=gtime+rand(7,14);}for(let i=flashSeq.length-1;i>=0;i--){const f=flashSeq[i];if(gtime>=f.t&&gtime<f.t+f.d)fl=Math.max(fl,f.i);if(gtime>f.t+f.d)flashSeq.splice(i,1);}moonLight.intensity=0.8+fl*7;hemi.intensity=0.35+fl*1.6;skyMat.uniforms.uFlash.value=fl;bolt.material.opacity=gtime<(bolt.userData.until||0)&&fl>0?1:0;
    drone.group.visible=false;mirror.visible=false;gradePass.uniforms.uTime.value=gtime;composer.render();return;}
  if(mode==='walk')updateWalk(dt);else if(mode==='drone')updateDrone(dt);else updateTour(dt);
  if(shake>0){camera.position.add(V3(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(shake*0.12));camera.rotation.z+=rand(-1,1)*shake*0.03;shake=Math.max(0,shake-dt*0.8);}
  updateWorld(dt);updateEvents(dt);updateGhost(dt);updateSparks(dt);updateListener();
  if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById('toast').style.opacity=0;}
  if(document.getElementById('map').style.display==='flex'&&Math.floor(gtime*4)!==Math.floor((gtime-dt)*4))drawMap();
  if((++frameN)%3===0||shake>0)moonLight.shadow.needsUpdate=true;
  gradePass.uniforms.uTime.value=gtime;composer.render();
}
frame();
